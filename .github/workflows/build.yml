name: Build Android

# On-demand only: trigger manually from the Actions tab (or `gh workflow run`).
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "What to build"
        type: choice
        default: apk
        options:
          - apk
          - aab
          - both
      mode:
        description: "Build mode"
        type: choice
        default: release
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        if: ${{ inputs.artifact == 'apk' || inputs.artifact == 'both' }}
        run: flutter build apk --${{ inputs.mode }}

      - name: Build AAB
        if: ${{ inputs.artifact == 'aab' || inputs.artifact == 'both' }}
        run: flutter build appbundle --${{ inputs.mode }}

      - name: Upload APK
        if: ${{ inputs.artifact == 'apk' || inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: swissfuel-apk-${{ inputs.mode }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ inputs.artifact == 'aab' || inputs.artifact == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: swissfuel-aab-${{ inputs.mode }}
          path: build/app/outputs/bundle/**/*.aab
          if-no-files-found: error
